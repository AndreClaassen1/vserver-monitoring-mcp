[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vserver-monitoring-mcp"
version = "0.1.0"
description = "MCP server for SSH-based vServer monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "André Claaßen"}
]
keywords = ["mcp", "monitoring", "ssh", "vserver", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "paramiko>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "ruff",
    "mypy",
    "unittest-xml-reporting",
]

[project.urls]
Homepage = "https://github.com/AndreClaassen1/vserver-monitoring-mcp"
Repository = "https://github.com/AndreClaassen1/vserver-monitoring-mcp"

[tool.setuptools]
py-modules = ["vserver_mcp"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
